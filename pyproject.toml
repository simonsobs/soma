[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soma"
version = "0.0.1"
authors = [
  { name="Mathew Madhavacheril", email="mathewsyriac@gmail.com" },
]
description = "A support library for pixell"
readme = "README.md"
license = { text = "MIT" }

requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",    
]
dependencies = [
    "numpy>=1.24",
    "astropy>=5.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pixell>=0.31",
    "matplotlib>=3.6",
    "pillow>=9.0",
    "healpy>=1.16",
    "pandas>=2.0",
    "ducc0>=0.34",
    "pywiggle>=0.1.25",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "sphinx>=7",
    "furo",
    "myst-nb>=1.0",
    "sphinx-copybutton",
    "sphinx-autobuild",
]
dev = [
    "soma[test,docs]",
    "ruff",
    "build",
]

[project.scripts]
soma-footprints = "soma.scripts.footprints:main"

[project.urls]
Homepage = "https://github.com/simonsobs/soma"
Documentation = "https://soma.readthedocs.io"
Issues = "https://github.com/simonsobs/soma/issues"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
soma = ["*.fits"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["soma"]
